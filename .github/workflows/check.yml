name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: install
        run: echo "依存なし"
      - id: typecheck
        run: node --check build.mjs && node --check works.mjs
      - id: test
        run: npm test
      - id: build
        run: npm run build

      # Discord に結果を知らせる。シークレット DISCORD_WEBHOOK_URL がなければ何もしない
      - name: Discord に知らせる
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TITLE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          COMMIT_URL: ${{ github.event.head_commit.url || github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/notify-discord.sh
