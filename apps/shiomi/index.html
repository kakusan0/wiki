<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E1218">
<title>潮見とひかり野線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Semi+Condensed:wght@600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="./src/menu.css">
</head>
<body>
<!-- はじめの画面：乗り物を選ぶ。選んだほうの画面（下の template）だけを出して動かす -->
<main id="menu" hidden>
  <h1>潮見とひかり野線</h1>
  <p class="lead">港町・潮見と、ひかり野線の走る同じ世界。トラックと列車で、荷物を運びます。</p>
  <nav class="modes">
    <a class="mode train" href="?mode=train">
      <b>電車を運転</b>
      <span>ひかり野線・あおば線・さざなみ線・貨物列車</span>
    </a>
    <a class="mode truck" href="?mode=truck">
      <b>トラックの仕事</b>
      <span>潮見港のコンテナと、貨物駅への荷物</span>
    </a>
  </nav>
</main>

<template id="tpl-train">
<canvas id="gl"></canvas>
<div id="hud" hidden>
  <div id="topbar"><span class="k">得点</span><b id="score" class="mono">0</b><span class="k">点</span></div>
  <section id="cpbar" aria-label="この区間のチェックポイント">
    <div class="ends"><span id="cpFrom">潮見台</span><span id="cpTo">浜田</span></div>
    <div class="track" id="cpTrack"><i class="me" id="cpMe"></i></div>
    <div id="cpNext" class="cpcard" aria-live="polite">
      <span class="key mono" id="cpKey">K</span>
      <div class="txt"><b id="cpTitle">場内信号の喚呼</b><small id="cpHint">K で喚呼</small></div>
      <span class="dist mono" id="cpDist">あと 230 m</span>
    </div>
    <div id="cpCount" class="count mono"></div>
  </section>
  <div id="cpFlash" aria-live="polite"></div>
  <section id="stopinfo" aria-label="次の停車駅">
    <div class="head">
      <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z" fill="currentColor"/></svg><b id="dist" class="mono">---</b></div>
      <div class="what"><span id="lineName" class="line">ひかり野線</span><b id="stopKind">停車</b><span><span id="nextSt">浜田</span><em class="cars">2 両</em></span></div>
    </div>
    <div class="clock"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg><b id="clock" class="mono">07:00:00</b></div>
    <ol id="timeline"></ol>
  </section>
  <section id="meter" aria-label="速度とブレーキ">
    <div class="rows">
      <span><i>到着まで</i><b id="toArr" class="mono">---</b></span>
      <span><i>停止位置</i><b id="dist2" class="mono">---</b></span>
      <span><i>勾配</i><b id="grade" class="mono">0.0‰</b></span>
    </div>
    <div class="gauges">
      <div id="notchCol" aria-hidden="true"></div>
      <canvas id="speedo" width="300" height="250" aria-label="速度計"></canvas>
      <div class="bars"><div class="bar"><i id="bcBar"></i></div><div class="bar mr"><i id="mrBar"></i></div><span>BC</span><span>MR</span></div>
    </div>
    <div class="status"><span id="notch" class="mono">B4</span><span id="door">戸閉</span><span id="ats" hidden>ATS</span></div>
  </section>
  <nav id="keys" aria-label="操作">
    <button data-act="call"><kbd>K</kbd>喚呼</button>
    <button data-act="horn"><kbd>H</kbd>警笛</button>
    <button data-act="announce"><kbd>A</kbd>車内放送</button>
    <button data-act="door"><kbd>O</kbd>ドア</button>
    <button data-act="wiper"><kbd>W</kbd>ワイパー</button>
    <button data-act="view"><kbd>C</kbd>視点</button>
    <button data-act="eb"><kbd>Space</kbd>非常</button>
    <button data-act="help"><kbd>?</kbd>操作の説明</button>
  </nav>
  <div id="fps" class="mono" hidden></div>
  <div id="toast" aria-live="polite"></div>
  <div id="sub" aria-live="polite"></div>
  <div id="stopcard" hidden></div>
  <div id="pad">
    <div id="lever" aria-label="マスコン：上へすべらせると加速、下へすべらせるとブレーキ" role="slider" aria-valuemin="-9" aria-valuemax="5" tabindex="0"><div id="knob">B4</div></div>
    <div id="btns">
      <button data-act="door">ドア<small>O</small></button>
      <button data-act="call">喚呼<small>K</small></button>
      <button data-act="announce">放送<small>A</small></button>
      <button data-act="horn">警笛<small>H</small></button>
      <button data-act="wiper">ワイパー<small>W</small></button>
      <button data-act="view">視点<small>C</small></button>
      <button data-act="eb" class="eb">非常<small>Space</small></button>
      <button data-act="help">操作<small>?</small></button>
    </div>
  </div>
</div>
<div id="title" class="screen">
  <div class="card">
    <p class="eyebrow">ひかり野線・あおば線・さざなみ線</p>
    <h1>ひかり野線 運転士</h1>
    <p class="lead">3 つの路線が交わる浜田の町と、海辺から山あいまで。時刻表どおりに走り、停止位置にぴたりと止めましょう。ほかの路線にも列車が走っていて、交差では信号がすれ違いを守ります。</p>
    <div id="netmap" role="img" aria-label="路線図"></div>
    <fieldset class="routes"><legend>運転する路線</legend><div id="routeCards"></div></fieldset>
    <details class="link-box">
      <summary>トラックのゲームとつなぐ（連携コード）</summary>
      <p class="code-row"><label for="linkInput">連携コード</label> <input id="linkInput" maxlength="8" autocomplete="off" spellcheck="false" placeholder="8 文字"> <button type="button" id="linkUse" class="ghost">つなぐ</button></p>
      <p id="linkNote" class="dim" aria-live="polite"></p>
    </details>
    <fieldset class="legs"><legend>出発駅と到着駅</legend>
      <label>出発<select id="fromSt"></select></label><span aria-hidden="true">→</span><label>到着<select id="toSt"></select></label>
      <small id="legNote"></small>
    </fieldset>
    <div class="opts">
      <fieldset><legend>むずかしさ</legend>
        <label><input type="radio" name="mode" value="easy" checked> かんたん<small>止まる位置の予測を表示</small></label>
        <label><input type="radio" name="mode" value="normal"> ふつう<small>ATS がきびしめ</small></label>
      </fieldset>
      <fieldset><legend>画質</legend>
        <label><input type="radio" name="q" value="auto" checked> 自動（おすすめ）<small>60 FPS を保つよう画質を自動で調整</small></label>
        <label><input type="radio" name="q" value="high"> 高（固定）<small>陰の暗がり・細かい影。速い GPU 向け</small></label>
        <label><input type="radio" name="q" value="low"> 標準（固定）<small>動きの軽さを優先</small></label>
      </fieldset>
    </div>
    <button id="startBtn" class="primary" disabled>景色を準備しています…</button>
    <p class="keys">Z 加速 ・ X ブレーキ ・ N 惰行 ・ Space 非常 ・ O ドア ・ K 喚呼 ・ A 放送 ・ H 警笛 ・ C 視点 ・ W ワイパー ・ F FPS 表示</p>
    <p class="credit">木・草・岩・地面などの素材：Poly Haven（CC0）</p>
  </div>
</div>
<div id="help" class="screen" hidden>
  <div class="card">
    <h2>運転のしかた</h2>
    <ol>
      <li><b>発車</b>：時刻表の発車時刻が近づいたら <kbd>O</kbd> でドアを閉める。戸閉の灯がついて、出発信号が青になったら <kbd>Z</kbd> で加速。</li>
      <li><b>走行</b>：制限速度（白い標識・黄色の信号は 45）を守る。超えると ATS のベルが鳴り、続けるとブレーキがかかって減点。</li>
      <li><b>停車</b>：<kbd>X</kbd> でブレーキを段階的に。黄色の「2」の目印に先頭を合わせて止め、<kbd>O</kbd> でドアを開ける。</li>
      <li><b>加点</b>：信号や標識の手前で <kbd>K</kbd> 喚呼、駅の手前で <kbd>A</kbd> 車内放送、「笛」の標識で <kbd>H</kbd> 警笛。</li>
    </ol>
    <p class="dim">マウスをドラッグすると、運転台から見回せます。スマホは右のレバーを上下にすべらせます。</p>
    <p class="dim">FPS（1 秒あたりのコマ数）といまの画質は、<kbd>F</kbd> キーか下のボタンで表示できます。</p>
    <button type="button" id="fpsBtn" class="ghost">FPS の表示を切り替える</button>
    <button class="primary" data-close>運転にもどる</button>
  </div>
</div>
<div id="result" class="screen" hidden></div>
<div id="rotate" class="screen" hidden>
  <div class="card" style="text-align:center">
    <div class="rot-icon" aria-hidden="true"></div>
    <h2>スマホを横向きにしてください</h2>
    <p class="dim">運転台は横向きの画面で遊びます。横にすると、止まっていた時間から続きが始まります。</p>
  </div>
</div>
<div id="loading">景色を作っています… <span id="loadPct"></span></div>
</template>

<template id="tpl-truck">
<canvas id="gl" aria-label="運転の画面"></canvas>

<div id="hud" hidden>
  <!-- 景色と一緒に水平を保つもの（速度と案内） -->
  <div id="level">
    <div id="speed" class="num"><b id="kmh">0</b><small>km/h</small><span id="limit" class="limit" aria-label="制限速度">20</span></div>
    <div id="nav" hidden>
      <b id="navArrow" aria-hidden="true">↑</b>
      <div><b id="navDist">--</b><small id="navTo">--</small></div>
    </div>
    <div id="guide" role="status" aria-live="polite"></div>
  </div>
  <canvas id="minimap" width="150" height="150" hidden aria-label="小さな地図（進む向きが上）"></canvas>
  <section id="align" class="panel" hidden aria-label="停止枠とのずれ">
    <div><span>前後</span><b id="aAlong" class="num">--</b></div>
    <div><span>左右</span><b id="aLat" class="num">--</b></div>
    <div><span>向き</span><b id="aYaw" class="num">--</b></div>
  </section>
  <section id="docked" class="panel" hidden aria-live="polite">
    <h2>積み込み完了</h2>
    <dl>
      <dt>停止枠</dt><dd id="dDock">--</dd>
      <dt>着地のずれ</dt><dd id="dLand" class="num">--</dd>
      <dt>強く下ろした</dt><dd id="dBump">--</dd>
    </dl>
    <p class="dim small">吊り具が上がりました。発進してかまいません。</p>
    <div class="row">
      <button type="button" id="closeResult" class="primary">運転を続ける</button>
      <button type="button" id="again" class="ghost">もう一度練習</button>
    </div>
  </section>
  <section id="delivered" class="panel" hidden aria-live="polite">
    <h2 id="vTitle">届けました</h2>
    <dl>
      <dt>かかった時間</dt><dd id="vTime">--</dd>
      <dt>停止枠</dt><dd id="vDock">--</dd>
      <dt>ぶつけた</dt><dd id="vHits">--</dd>
      <dt>速度の超過</dt><dd id="vOver">--</dd>
      <dt>右側の走行</dt><dd id="vWrong">--</dd>
    </dl>
    <p class="dim small" id="vNote"></p>
    <button type="button" id="againAll" class="primary">依頼を選ぶ</button>
  </section>
  <!-- クレーンの操作（積み込みの間だけ） -->
  <div id="craneHud">
    <ol id="stages" aria-label="積み込みの段階">
      <li class="done">✓ つかむ</li><li data-s="carry">運ぶ</li><li data-s="lower">下ろす</li><li data-s="lock">ロック</li>
    </ol>
    <section id="cread" class="panel" aria-label="吊ったコンテナとシャーシのずれ">
      <div><span>前後</span><b id="cAlong" class="num">--</b></div>
      <div><span>左右</span><b id="cLat" class="num">--</b></div>
      <div><span>向き</span><b id="cYaw" class="num">--</b></div>
      <div><span>高さ</span><b id="cH" class="num">--</b></div>
      <div><span>揺れ</span><span id="cSway" class="sway" aria-label="揺れ"><i></i><i></i><i></i><i></i></span></div>
    </section>
    <p id="chint" class="panel">スマホを傾けて吊り具を動かす（左右に傾ける＝左右、奥へ倒す＝前）。止めたい所の少し手前で戻すと、揺れが早く収まる。</p>
    <div id="craneCtl">
      <div id="hoist" role="slider" tabindex="0" aria-label="巻き上げと巻き下げ：上へすべらせると上げる、下へすべらせると下げる" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0">
        <span>上げる</span><b id="hoistKnob">止</b><span>下げる</span>
      </div>
      <div class="col">
        <button type="button" id="lock" disabled>ロック<small id="lockNote">まだ合っていない</small></button>
        <div class="skew">
          <button type="button" id="skewL" aria-label="吊り具を左へ回す">↺</button>
          <button type="button" id="skewR" aria-label="吊り具を右へ回す">↻</button>
        </div>
      </div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <nav id="buttons" aria-label="運転の操作">
    <button type="button" id="gear" class="round" aria-label="前進と後退の切り替え">D</button>
    <button type="button" id="center" class="pill" aria-label="傾きをリセット：いまの持ち方をまっすぐにする">⟲ まっすぐ</button>
    <button type="button" id="view" class="round" aria-label="視点の切り替え">◎</button>
    <button type="button" id="reset" class="round" aria-label="スタートに戻る">↺</button>
  </nav>
  <div id="brake" class="pedal" role="slider" aria-label="ブレーキ：上の方を押すほど強い" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i><span>ブレーキ</span></div>
  <div id="accel" class="pedal" role="slider" aria-label="アクセル：上の方を押すほど強い" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i><span>アクセル</span></div>
</div>

<div id="title" class="screen">
  <div class="card">
    <p class="eyebrow">ナギサ運輸・練習場</p>
    <h1>潮見港コンテナ便</h1>
    <ol class="how">
      <li><b>ハンドル</b>：スマホを左右に傾ける。景色は傾けても水平のまま。</li>
      <li><b>ペダル</b>：左下がブレーキ、右下がアクセル。上の方を押すほど強い。</li>
      <li><b>練習</b>：コーンをよけて通路へ。門型クレーンの下の停止枠に、前進で入って止める。</li>
    </ol>
    <fieldset class="jobs-box"><legend>依頼</legend><div id="jobs" class="jobs"></div></fieldset>
    <details class="link-box">
      <summary>ひかり野線とつなぐ（連携コード）</summary>
      <p class="code-row">コード <b id="linkCode" class="num">まだ作っていません</b>
        <button type="button" id="linkMake" class="ghost small-btn">作る</button>
        <button type="button" id="linkCopy" class="ghost small-btn">コピー</button></p>
      <p class="code-row"><label for="linkInput">ほかの端末のコード</label> <input id="linkInput" maxlength="8" autocomplete="off" spellcheck="false" placeholder="8 文字"> <button type="button" id="linkUse" class="ghost small-btn">使う</button></p>
      <p id="linkNote" class="dim small" aria-live="polite"></p>
    </details>
    <fieldset class="seg" aria-label="ハンドルの効き">
      <legend>ハンドルの効き</legend>
      <label><input type="radio" name="sens" value="0.8"> おだやか</label>
      <label><input type="radio" name="sens" value="1" checked> ふつう</label>
      <label><input type="radio" name="sens" value="1.3"> 鋭い</label>
    </fieldset>
    <button id="startTilt" class="primary" disabled>素材を読み込んでいます…</button>
    <button id="startKeys" class="ghost">キーボードで試す（パソコン）</button>
    <p class="dim small">スマホを横に持ち、運転するときの角度で「まっすぐ」が決まります。運転中も、右上の「⟲ まっすぐ」で何度でもリセットできます。</p>
    <p class="dim small">キー：← → ハンドル ・ ↑ アクセル ・ ↓ ブレーキ ・ R 前進と後退 ・ C 視点 ・ Space まっすぐ。クレーン：矢印で動かす ・ W/S 上げ下げ ・ Z/X 回す ・ L ロック</p>
    <p class="credit">地面や金属の素材：Poly Haven（CC0）</p>
  </div>
</div>

<div id="rotate" class="screen" hidden>
  <div class="card center">
    <div class="rot-icon" aria-hidden="true"></div>
    <h2>スマホを横向きにしてください</h2>
    <p class="dim">運転は横向きの画面で遊びます。</p>
  </div>
</div>

</template>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
