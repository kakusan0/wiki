<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>スタッフ セットアップ</title>
<link rel="stylesheet" href="/qr-order/style.css">
<script src="/qr-order/theme.js"></script>
<link rel="manifest" href="/qr-order/staff.webmanifest">
<meta name="apple-mobile-web-app-title" content="店舗管理">
<meta name="theme-color" content="#0a6b50" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101311" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/qr-order/icons/staff-192.png">
<link rel="apple-touch-icon" href="/qr-order/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/qr-order/pwa.js" defer></script>
<script src="/qr-order/passkey.js"></script>
</head>
<body>
<header class="bar"><h1>スタッフ セットアップ</h1></header>
<main>
  <p class="note">メールで届く確認コードで本人確認をしたあと、この端末にパスキーを登録します。以後はパスキーだけでログインします（パスワードはありません）。</p>
  <p id="error" class="error" role="alert" hidden></p>

  <form id="step-email" class="card form">
    <strong>1. メールアドレス</strong>
    <label>登録されているメールアドレス<input id="email" type="email" required autocomplete="email" autocapitalize="none" spellcheck="false"></label>
    <button class="primary">確認コードを送る</button>
  </form>

  <form id="step-code" class="card form" hidden>
    <strong>2. 確認コード</strong>
    <p class="note">セットアップの対象になっているアドレスには、6 桁の確認コードをメールで送りました（有効期限 10 分）。届かない場合は、アドレスの入力間違いや迷惑メールフォルダを確認してください。</p>
    <label>確認コード（6 桁）<input id="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label>
    <button class="primary">確認する</button>
    <button id="back" type="button" class="ghost">メールアドレスを入れ直す</button>
  </form>

  <div id="step-passkey" class="card form" hidden>
    <strong>3. パスキーの登録</strong>
    <p class="note">下のボタンを押すと、端末が指紋・顔・画面ロックでの確認を求めます。5 分以内に完了してください。</p>
    <button id="register" class="primary">この端末にパスキーを登録する</button>
  </div>

  <p class="note">すでに登録済みの方は <a href="/qr-order/staff/login">ログイン</a> へ。</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fail = (msg) => { $('error').textContent = msg; $('error').hidden = false; };
const post = (path, body) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
const show = (step) => { for (const s of ['step-email', 'step-code', 'step-passkey']) $(s).hidden = s !== step; $('error').hidden = true; };
let registration = null;

if (!passkey.supported()) fail('このブラウザはパスキーに対応していません。最新の Chrome / Safari / Edge をお使いください。');

$('step-email').onsubmit = async (ev) => {
  ev.preventDefault();
  const btn = ev.target.querySelector('button'); btn.disabled = true; $('error').hidden = true;
  try {
    const res = await post('/qr-order/api/staff/setup/request', { email: $('email').value });
    if (res.ok) { show('step-code'); $('code').value = ''; $('code').focus(); }
    else if (res.status === 429) fail('送信回数が多すぎます。15 分ほど待ってからやり直してください。');
    else if (res.status === 502) fail('確認コードのメールを送信できませんでした。管理者にお問い合わせください。');
    else fail('メールアドレスを確認してください。');
  } catch { fail('通信できませんでした。もう一度お試しください。'); }
  btn.disabled = false;
};

$('back').onclick = () => show('step-email');

$('step-code').onsubmit = async (ev) => {
  ev.preventDefault();
  const btn = ev.target.querySelector('button'); btn.disabled = true; $('error').hidden = true;
  try {
    const res = await post('/qr-order/api/staff/setup/verify', { email: $('email').value, code: $('code').value });
    if (res.ok) { registration = await res.json(); show('step-passkey'); }
    else if (res.status === 429) fail('試行回数が多すぎます。15 分ほど待ってからやり直してください。');
    else fail('確認コードが違うか、有効期限が切れています。5 回間違えると無効になります。その場合は確認コードを送り直してください。');
  } catch { fail('通信できませんでした。もう一度お試しください。'); }
  btn.disabled = false;
};

$('register').onclick = async () => {
  $('register').disabled = true; $('error').hidden = true;
  try {
    let response;
    try { response = await passkey.create(registration.options); }
    catch { $('register').disabled = false; return fail('パスキーの登録が完了しませんでした。もう一度ボタンを押してください。'); }
    const res = await post('/qr-order/api/staff/setup/finish', { challengeId: registration.challengeId, response });
    if (res.ok) { location.href = '/qr-order/staff'; return; }
    show('step-email');
    fail('登録できませんでした（時間切れの可能性があります）。最初からやり直してください。');
  } catch { fail('通信できませんでした。もう一度お試しください。'); }
  $('register').disabled = false;
};
</script>
</body>
</html>
