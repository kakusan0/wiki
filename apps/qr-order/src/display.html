<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>店舗 QR コード</title>
<link rel="stylesheet" href="/qr-order/style.css">
<script src="/qr-order/theme.js"></script>
<meta name="theme-color" content="#0a6b50" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101311" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/qr-order/icons/app-192.png">
<link rel="apple-touch-icon" href="/qr-order/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/qr-order/pwa.js" defer></script>
<style>
  body { display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 24px; }
  h1 { font-size: clamp(1.4rem, 4vw, 2.4rem); margin-bottom: 8px; }
  p { margin: 8px 0; }
  #qr { width: min(72vmin, 640px); height: auto; aspect-ratio: 1; border-radius: 24px; }
  #lead { font-size: clamp(1rem, 2.6vw, 1.5rem); font-weight: 700; }
</style>
</head>
<body>
<div>
  <h1 id="name">ご注文はこちら</h1>
  <p id="lead">スマートフォンのカメラで読み取ってください</p>
  <p><img id="qr" alt="店舗QRコード"></p>
  <p id="state" class="note"></p>
</div>
<script>
// 入口のタブレットなどに映しておく画面。QR コードを定期的に取り直して、常に有効なものを表示する
const store = new URLSearchParams(location.search).get('store') || '';
const img = document.getElementById('qr');
async function refresh() {
  try {
    const res = await fetch('/qr-order/staff/qr.svg?store=' + encodeURIComponent(store) + '&_=' + Date.now(), { cache: 'no-store' });
    if (res.status === 401) { location.href = '/qr-order/staff/login'; return; }
    if (!res.ok) throw new Error();
    const url = URL.createObjectURL(await res.blob());
    const old = img.src;
    img.src = url;
    if (old.startsWith('blob:')) URL.revokeObjectURL(old);
    const minutes = Number(res.headers.get('X-QR-Rotate-Minutes') || 0);
    document.getElementById('state').textContent = minutes ? 'この QR コードは ' + (minutes >= 60 ? minutes / 60 + ' 時間' : minutes + ' 分') + 'ごとに新しくなります' : '';
  } catch {
    document.getElementById('state').textContent = '通信できません。QR コードが古い可能性があります。';
  }
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
